# Dedicated TLS listener preserves compatibility of the existing HTTP/1.1 port.
server {
    listen 18447 ssl;
    http2 on;
    server_name REPLACE_WITH_VPN_HOST;
    ssl_certificate /etc/letsencrypt/live/REPLACE_WITH_VPN_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_VPN_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location /home-vpn-h2/ {
        grpc_pass grpc://127.0.0.1:18445;
        client_body_timeout 3600s;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
        client_max_body_size 0;
        access_log off;
    }
    location / { return 404; }
}
