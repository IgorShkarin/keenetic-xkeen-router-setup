# Include inside the existing HTTPS server block; retain certificate validation.
location /home-vpn-xhttp/ {
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:18444;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    access_log off;
}
